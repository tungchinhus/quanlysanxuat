<div class="approve-dialog-container">
  <div class="dialog-header">
    <h2 mat-dialog-title>
      <mat-icon class="header-icon">check_circle</mat-icon>
      Xác nhận duyệt KCS
    </h2>
    <button mat-icon-button mat-dialog-close class="close-button">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="dialog-content">
    <div class="item-info">
      <p><strong>Ký hiệu:</strong> {{data.itemName}}</p>
      <p><strong>Loại:</strong> {{getItemTypeDisplayName(data.itemType)}}</p>
    </div>

    <form [formGroup]="approveForm" class="approve-form">
      <div class="resistance-fields">
        <h3>Điện trở</h3>
        <div class="resistance-row">
          <mat-form-field appearance="outline">
            <mat-label>Ra</mat-label>
            <input matInput type="number" formControlName="ra" placeholder="Nhập Ra" min="0" step="0.001">
          </mat-form-field>
          <mat-form-field appearance="outline">
            <mat-label>Rb</mat-label>
            <input matInput type="number" formControlName="rb" placeholder="Nhập Rb" min="0" step="0.001">
          </mat-form-field>
          <mat-form-field appearance="outline">
            <mat-label>Rc</mat-label>
            <input matInput type="number" formControlName="rc" placeholder="Nhập Rc" min="0" step="0.001">
          </mat-form-field>
        </div>
      </div>
    </form>
  </div>

  <div class="dialog-actions">
    <button 
      mat-button 
      (click)="onCancel()" 
      [disabled]="isLoading">
      Hủy
    </button>
    <button 
      mat-raised-button 
      color="primary" 
      (click)="onSubmit()" 
      [disabled]="isLoading || !approveForm.valid"
      class="submit-button">
      <mat-spinner diameter="20" *ngIf="isLoading"></mat-spinner>
      <span *ngIf="!isLoading">Duyệt KCS</span>
    </button>
  </div>
</div>
